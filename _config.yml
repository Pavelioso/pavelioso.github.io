#-------------------------------
# General Site Settings
title: PAVEL NEČAS
logo: # You can add own logo. For example '/images/logo.png'.
description: "Creative technologist helping companies turn new ideas into real things, for a whole project or one specific piece."
# Link previews (WhatsApp, LinkedIn, Slack, X...). Homepage <title> and og:title; posts use their own title.
seo_title: "Pavel Nečas – Creative technologist & programmer"
# Default share image (1200x630 JPG, keep under ~300 KB for WhatsApp). Posts with an `image:` use their own cover.
og_image: /images/og-image.jpg
baseurl: "" # The subpath of your site, e.g. /blog
url: "https://www.pavelnecas.com" # The base hostname & protocol for your site, e.g. http://example.com

header:
  show_logo: false
  show_search: false


#-------------------------------
# Author Settings
author:
  name: Pavel Nečas
  avatar: '/images/about/about-1.jpg'


#-------------------------------
# Hero Settings
hero:
  eyebrow: Pavel Nečas # small label above the headline
  title: "Ahoj, I'm Pavel."
  # Longer intro (not rendered on the homepage; kept in sync with the subline)
  description: >
    I help companies turn new ideas into real things. Sometimes that means coming in for a whole project and staying with it from the first concept and research through prototyping, finding the right people, and building it, all the way to launch. Other times a team just needs one piece done well, like a Unity or Unreal prototype, an interactive installation, a VR scene or an AI tool, and I can jump in for exactly that. Over 15 years I've worked on live-event installations, VR, games and, more and more, applied AI.
  image: '/images/backgrounds/bg-1.jpg'
  # Short lines shown in the homepage hero, under the headline
  # Optional bold line between headline and subline; left empty because the subline already lists the fields
  pitch:
  # Opening sentence of the intro paragraph, slightly emphasised
  subline_lead: "I help companies turn new ideas into real things."
  subline: "Sometimes that means coming in for a whole project and staying with it from the first concept and research through prototyping, finding the right people, and building it, all the way to launch. Other times a team just needs one piece done well, like a Unity or Unreal prototype, an interactive installation, a VR scene or an AI tool, and I can jump in for exactly that. Over 15 years I've worked on live-event installations, VR, games and, more and more, applied AI."

#-------------------------------
# Homepage project filters (client-side). A project matches a filter if it has any of the listed tags.
# A filter button is only shown when at least one project matches it.
project_filters:
  - {label: Gamedev, slug: gamedev, tags: [gamedev, gamedesign, leveldesign, VR]}
  - {label: Events, slug: events, tags: [events, installation, videomapping]}
  - {label: Concept, slug: concept, tags: [concept]}
  - {label: Interactive Tech, slug: interactive, tags: [interactive]}
  - {label: Programming, slug: programming, tags: [programming]}
  - {label: Electronics & Auto, slug: electronics-auto, tags: [electronics-auto]}

#-------------------------------
# Gamedev Section Settings
gamedev:
  title: My Gamedev Journey
  description: > 
    These are some of my gamedev works. I've released one indie game called Expedition Zero, and I've included here some of my VR projects as well. 

#-------------------------------
# Events Settings
events:
  title: Events
  description: > 
    I was designing and producing installations, usually real-time. Software was typically Touch Designer and Unreal Engine. 

#-------------------------------
# Industrial Design Settings
electronics-auto:
  title: Electronics & Automotive
  description: > 
    I am an avid fan of electronics, automotive systems, and diagnosing legacy systems. 
    I also design and share 3D printable models, which you can find on my [Printables profile](https://www.printables.com/@Pavelios_4547983),
    and I post diagnostics videos (cars, tools, computers and more) on my YouTube channel [diagnosement](https://www.youtube.com/@diagnosement).



#-------------------------------
# Contact Settings
contact:
  email: f/xpzelroq # Add your email for contact form
  description: Because of spam bots, please send me message through here and I will get back to asap! Or you can use this pavel (at & at) nonode . dev . My Discord is Pavelios 4451.  # Add a description of your form

# NOTE
# Norlin theme comes with a contact form built-in. You can use this form with Formspree (https://formspree.io/) service and get up to 50 submissions for free. Also, you can easily switch to another service if you want.


