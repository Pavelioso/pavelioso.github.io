<div class="contact-card">
  <p class="contact-card__text">
    The easiest way to reach me is email on the nonode.dev domain.
  </p>

  <p class="contact-card__fallback">
    Address format: first name, then the usual sign, then this domain.
  </p>

  <div class="contact-card__actions">
    <a
      class="button button--primary js-protected-email"
      href="#"
      data-user="levap"
      data-domain="edonon"
      data-tld="ved"
      rel="nofollow"
    >Reveal Email</a>
  </div>
</div>

<script>
  (function () {
    var link = document.querySelector('.js-protected-email');
    if (!link) return;

    function reverse(value) {
      return value.split('').reverse().join('');
    }

    link.addEventListener('click', function (event) {
      var address = reverse(link.dataset.user) + '@' + reverse(link.dataset.domain) + '.' + reverse(link.dataset.tld);
      link.href = 'mailto:' + address;
      link.textContent = address;

      if (event.type === 'click' && link.getAttribute('href') === '#') {
        event.preventDefault();
      }
    }, { once: true });
  }());
</script>
